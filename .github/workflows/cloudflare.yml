name: Deploy to Cloudflare Pages
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source and build public output
        env:
          SITE_ORIGIN: https://velora-75y.pages.dev
        run: |
          npm run check
          npm run build
          ls dist
      - name: Deploy to the verified VELORA Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=velora-75y --branch=main
