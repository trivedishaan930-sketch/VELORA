name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velora-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify source and build public output
        env:
          SITE_ORIGIN: https://velora-75y.pages.dev
        run: |
          npm run check
          npm run build
          ls dist

      - name: Deploy to the existing VELORA Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=velora --branch=main

      - name: Verify live production deployment
        env:
          SITE_ORIGIN: https://velora-75y.pages.dev
        run: |
          set -euo pipefail
          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/" -o "$RUNNER_TEMP/velora-home.html"
          grep -Fq '<title>VELORA — Romance, Travel & Thoughtful Experiences</title>' "$RUNNER_TEMP/velora-home.html"
          grep -Fq "<link rel=\"canonical\" href=\"$SITE_ORIGIN/\">" "$RUNNER_TEMP/velora-home.html"
          grep -Fq 'href="/experiences/"' "$RUNNER_TEMP/velora-home.html"
          grep -Fq 'href="/travel/"' "$RUNNER_TEMP/velora-home.html"
          grep -Fq 'href="/style/"' "$RUNNER_TEMP/velora-home.html"
          grep -Fq 'href="/journal/"' "$RUNNER_TEMP/velora-home.html"
          grep -Fq 'href="/about/"' "$RUNNER_TEMP/velora-home.html"
          grep -Fq 'couple-sunset-walk.webp' "$RUNNER_TEMP/velora-home.html"
          grep -Fq 'maldives.webp' "$RUNNER_TEMP/velora-home.html"
          grep -Fq 'amalfi-coast.webp' "$RUNNER_TEMP/velora-home.html"
          grep -Fq 'kyoto-garden.webp' "$RUNNER_TEMP/velora-home.html"
          grep -Fq 'THOUGHTFUL EXPERIENCES. BEAUTIFULLY CONSIDERED.' "$RUNNER_TEMP/velora-home.html"
          if grep -Fq 'MADE FOR ADULTS' "$RUNNER_TEMP/velora-home.html"; then
            echo "Unwanted adult-only announcement wording is still present."
            exit 1
          fi

          for asset in \
            public/assets/experiences/couple-sunset-walk.webp \
            public/assets/destinations/maldives.webp \
            public/assets/destinations/amalfi-coast.webp \
            public/assets/destinations/kyoto-garden.webp; do
            curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/$asset" -o /dev/null
          done
          if grep -Fq 'velora-hero-editorial.svg' "$RUNNER_TEMP/velora-home.html"; then
            echo "Temporary illustration hero is still referenced by the public homepage."
            exit 1
          fi
          if grep -Fq 'velora-sunset-couple.jpg' "$RUNNER_TEMP/velora-home.html"; then
            echo "Rejected hero asset is still referenced by the public homepage."
            exit 1
          fi

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/experiences/" -o "$RUNNER_TEMP/velora-experiences.html"
          grep -Fq '<title>Getaway & Experience Planner | VELORA</title>' "$RUNNER_TEMP/velora-experiences.html"
          grep -Fq "href=\"$SITE_ORIGIN/experiences/\"" "$RUNNER_TEMP/velora-experiences.html"
          grep -Fq 'id="plannerForm"' "$RUNNER_TEMP/velora-experiences.html"
          grep -Fq 'id="planBudgetCurrency"' "$RUNNER_TEMP/velora-experiences.html"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/style/" -o "$RUNNER_TEMP/velora-style.html"
          grep -Fq '<title>Personal Style & Travel Outfits | VELORA</title>' "$RUNNER_TEMP/velora-style.html"
          grep -Fq 'id="styleStudio"' "$RUNNER_TEMP/velora-style.html"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/journal/" -o "$RUNNER_TEMP/velora-journal.html"
          grep -Fq '<title>The VELORA Journal — Stories & Date Ideas</title>' "$RUNNER_TEMP/velora-journal.html"
          grep -Fq 'href="/journal/postcards-from-blue-hour/"' "$RUNNER_TEMP/velora-journal.html"
          grep -Fq 'href="/journal/small-gestures/"' "$RUNNER_TEMP/velora-journal.html"
          grep -Fq 'href="/journal/a-night-with-no-itinerary/"' "$RUNNER_TEMP/velora-journal.html"

          for route in journal/postcards-from-blue-hour journal/small-gestures journal/a-night-with-no-itinerary about; do
            curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/$route/" -o "$RUNNER_TEMP/velora-route.html"
            grep -Fq '<h1' "$RUNNER_TEMP/velora-route.html"
            grep -Fq 'rel="canonical"' "$RUNNER_TEMP/velora-route.html"
          done

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/travel/" -o "$RUNNER_TEMP/velora-travel.html"
          grep -Fq '<title>Travel Planning, With Confidence — VELORA Travel Guides</title>' "$RUNNER_TEMP/velora-travel.html"
          grep -Fq "<link rel=\"canonical\" href=\"$SITE_ORIGIN/travel/\">" "$RUNNER_TEMP/velora-travel.html"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/travel/india-arrival-ready/" -o "$RUNNER_TEMP/velora-india-arrival.html"
          grep -Fq '<title>India Arrival Ready: Your First 72 Hours — VELORA</title>' "$RUNNER_TEMP/velora-india-arrival.html"
          grep -Fq "<link rel=\"canonical\" href=\"$SITE_ORIGIN/travel/india-arrival-ready/\">" "$RUNNER_TEMP/velora-india-arrival.html"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/travel/first-international-trip/" -o "$RUNNER_TEMP/velora-first-trip.html"
          grep -Fq '<title>First International Trip Checklist — VELORA</title>' "$RUNNER_TEMP/velora-first-trip.html"
          grep -Fq "<link rel=\"canonical\" href=\"$SITE_ORIGIN/travel/first-international-trip/\">" "$RUNNER_TEMP/velora-first-trip.html"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/travel/budget-planner/" -o "$RUNNER_TEMP/velora-budget-planner.html"
          grep -Fq '<title>Trip Budget Planner — Estimate Your Travel Costs | VELORA</title>' "$RUNNER_TEMP/velora-budget-planner.html"
          grep -Fq "<link rel=\"canonical\" href=\"$SITE_ORIGIN/travel/budget-planner/\">" "$RUNNER_TEMP/velora-budget-planner.html"
          grep -Fq 'id="plannerContextNote"' "$RUNNER_TEMP/velora-budget-planner.html"

          for policy in privacy terms safety; do
            curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/$policy/" -o "$RUNNER_TEMP/velora-$policy.html"
            grep -Fq '<title>' "$RUNNER_TEMP/velora-$policy.html"
            grep -Fq "href=\"$SITE_ORIGIN/$policy/\"" "$RUNNER_TEMP/velora-$policy.html"
            if cmp -s "$RUNNER_TEMP/velora-$policy.html" "$RUNNER_TEMP/velora-home.html"; then
              echo "Policy route /$policy/ returned the homepage instead of its own page."
              exit 1
            fi
          done

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/robots.txt" -o "$RUNNER_TEMP/velora-robots.txt"
          grep -Fq "Sitemap: $SITE_ORIGIN/sitemap.xml" "$RUNNER_TEMP/velora-robots.txt"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/sitemap.xml" -o "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/travel/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/travel/india-arrival-ready/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/travel/first-international-trip/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/travel/budget-planner/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/experiences/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/style/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/journal/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/about/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/api/health" -o "$RUNNER_TEMP/velora-health.json"
          node -e 'const fs = require("node:fs"); const h = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (h.ok !== true) process.exit(1); console.log("API reachable; databaseConfigured=" + h.databaseConfigured + "; amazonCreatorsApiConfigured=" + h.amazonCreatorsApiConfigured);' "$RUNNER_TEMP/velora-health.json"

          echo "Production smoke checks passed: homepage, planner, style, journal articles, travel, policies, canonical URLs, robots, sitemap and API health."
