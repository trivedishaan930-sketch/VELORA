name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: velora-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify source and build public output
        env:
          SITE_ORIGIN: https://velora-75y.pages.dev
        run: |
          npm run check
          npm run build
          ls dist

      - name: Deploy to the existing VELORA Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=velora --branch=main

      - name: Verify live production deployment
        env:
          SITE_ORIGIN: https://velora-75y.pages.dev
        run: |
          set -euo pipefail
          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/" -o "$RUNNER_TEMP/velora-home.html"
          grep -Fq '<title>VELORA — Make Room for Romance</title>' "$RUNNER_TEMP/velora-home.html"
          grep -Fq "<link rel=\"canonical\" href=\"$SITE_ORIGIN/\">" "$RUNNER_TEMP/velora-home.html"
          grep -Fq 'id="planOccasion"' "$RUNNER_TEMP/velora-home.html"
          grep -Fq 'id="ecosystem"' "$RUNNER_TEMP/velora-home.html"
          grep -Fq 'velora-hero-editorial.svg' "$RUNNER_TEMP/velora-home.html"
          ! grep -Fq 'velora-sunset-couple.jpg' "$RUNNER_TEMP/velora-home.html"
          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/public/assets/hero/velora-hero-editorial.svg" -o "$RUNNER_TEMP/velora-hero.svg"
          grep -Fq 'VELORA editorial courtyard' "$RUNNER_TEMP/velora-hero.svg"
          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/velora-premium.css" -o "$RUNNER_TEMP/velora-premium.css"
          grep -Fq '.ecosystem-grid' "$RUNNER_TEMP/velora-premium.css"
          grep -Fq 'id="ecosystem"' "$RUNNER_TEMP/velora-home.html"
          grep -Fq 'velora-hero-editorial.svg' "$RUNNER_TEMP/velora-home.html"
          ! grep -Fq 'velora-sunset-couple.jpg' "$RUNNER_TEMP/velora-home.html"
          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/public/assets/hero/velora-hero-editorial.svg" -o "$RUNNER_TEMP/velora-hero.svg"
          grep -Fq 'VELORA editorial courtyard' "$RUNNER_TEMP/velora-hero.svg"
          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/velora-premium.css" -o "$RUNNER_TEMP/velora-premium.css"
          grep -Fq '.ecosystem-grid' "$RUNNER_TEMP/velora-premium.css"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/travel/" -o "$RUNNER_TEMP/velora-travel.html"
          grep -Fq '<title>Travel Planning, With Confidence — VELORA Travel Guides</title>' "$RUNNER_TEMP/velora-travel.html"
          grep -Fq "<link rel=\"canonical\" href=\"$SITE_ORIGIN/travel/\">" "$RUNNER_TEMP/velora-travel.html"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/travel/india-arrival-ready/" -o "$RUNNER_TEMP/velora-india-arrival.html"
          grep -Fq '<title>India Arrival Ready: Your First 72 Hours — VELORA</title>' "$RUNNER_TEMP/velora-india-arrival.html"
          grep -Fq "<link rel=\"canonical\" href=\"$SITE_ORIGIN/travel/india-arrival-ready/\">" "$RUNNER_TEMP/velora-india-arrival.html"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/travel/first-international-trip/" -o "$RUNNER_TEMP/velora-first-trip.html"
          grep -Fq '<title>Your First International Trip: A Practical Checklist — VELORA</title>' "$RUNNER_TEMP/velora-first-trip.html"
          grep -Fq "<link rel=\"canonical\" href=\"$SITE_ORIGIN/travel/first-international-trip/\">" "$RUNNER_TEMP/velora-first-trip.html"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/travel/budget-planner/" -o "$RUNNER_TEMP/velora-budget-planner.html"
          grep -Fq '<title>Trip Budget Planner — Estimate Your Travel Costs | VELORA</title>' "$RUNNER_TEMP/velora-budget-planner.html"
          grep -Fq "<link rel=\"canonical\" href=\"$SITE_ORIGIN/travel/budget-planner/\">" "$RUNNER_TEMP/velora-budget-planner.html"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/privacy/" -o "$RUNNER_TEMP/velora-privacy.html"
          grep -Fq '<title>Privacy | VELORA</title>' "$RUNNER_TEMP/velora-privacy.html"
          grep -Fq "<link rel=\\"canonical\\" href=\\"$SITE_ORIGIN/privacy/\\">" "$RUNNER_TEMP/velora-privacy.html"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/terms/" -o "$RUNNER_TEMP/velora-terms.html"
          grep -Fq '<title>Terms of Use | VELORA</title>' "$RUNNER_TEMP/velora-terms.html"
          grep -Fq "<link rel=\\"canonical\\" href=\\"$SITE_ORIGIN/terms/\\">" "$RUNNER_TEMP/velora-terms.html"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/safety/" -o "$RUNNER_TEMP/velora-safety.html"
          grep -Fq '<title>Safety &amp; Respect | VELORA</title>' "$RUNNER_TEMP/velora-safety.html"
          grep -Fq "<link rel=\\"canonical\\" href=\\"$SITE_ORIGIN/safety/\\">" "$RUNNER_TEMP/velora-safety.html"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/robots.txt" -o "$RUNNER_TEMP/velora-robots.txt"
          grep -Fq "Sitemap: $SITE_ORIGIN/sitemap.xml" "$RUNNER_TEMP/velora-robots.txt"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/sitemap.xml" -o "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/travel/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/travel/india-arrival-ready/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/travel/first-international-trip/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/travel/budget-planner/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/privacy/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/terms/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"
          grep -Fq "<loc>$SITE_ORIGIN/safety/</loc>" "$RUNNER_TEMP/velora-sitemap.xml"

          curl --retry 8 --retry-all-errors --retry-delay 3 -fsS "$SITE_ORIGIN/api/health" -o "$RUNNER_TEMP/velora-health.json"
          node -e 'const fs = require("node:fs"); const h = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (h.ok !== true) process.exit(1); console.log("API reachable; databaseConfigured=" + h.databaseConfigured + "; amazonCreatorsApiConfigured=" + h.amazonCreatorsApiConfigured);' "$RUNNER_TEMP/velora-health.json"

          echo "Production smoke checks passed: homepage, four travel pages, canonical URLs, robots, sitemap and API health."
