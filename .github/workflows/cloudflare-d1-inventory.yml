name: Inspect Cloudflare D1 inventory

on:
  push:
    paths:
      - ".github/workflows/cloudflare-d1-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only D1 inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: List existing D1 databases (read only)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: d1 list
