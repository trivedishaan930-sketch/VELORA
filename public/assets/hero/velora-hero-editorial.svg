<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">VELORA editorial courtyard</title>
<desc id="desc">An elegant architectural courtyard at golden hour, with two fully clothed adults walking together beneath a stone arch.</desc>
<defs>
 <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1422"/><stop offset=".52" stop-color="#17364a"/><stop offset="1" stop-color="#314d55"/></linearGradient>
 <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8d9bf"/><stop offset=".48" stop-color="#bda98b"/><stop offset="1" stop-color="#776e61"/></linearGradient>
 <linearGradient id="sky" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#d9b987"/><stop offset=".55" stop-color="#a77f65"/><stop offset="1" stop-color="#42515a"/></linearGradient>
 <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4dba8" stop-opacity=".8"/><stop offset="1" stop-color="#d7b36a" stop-opacity="0"/></linearGradient>
 <linearGradient id="coatA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#253e4e"/><stop offset="1" stop-color="#101a2c"/></linearGradient>
 <linearGradient id="coatB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eee3d0"/><stop offset="1" stop-color="#b5a58d"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="36"/></filter>
 <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse"><circle cx="6" cy="12" r="1" fill="#fff" opacity=".1"/><circle cx="61" cy="43" r=".8" fill="#fff" opacity=".07"/><circle cx="35" cy="76" r=".7" fill="#fff" opacity=".08"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#backdrop)"/>
<ellipse cx="1190" cy="410" rx="430" ry="390" fill="url(#goldGlow)" filter="url(#soft)" opacity=".5"/>
<!-- left editorial negative space -->
<path d="M0 0H780L680 900H0Z" fill="#0b1422" opacity=".36"/>
<path d="M0 720C260 680 420 730 710 650V900H0Z" fill="#101a2c" opacity=".48"/>
<!-- courtyard architecture -->
<path d="M770 0H1600V900H710V330C710 140 780 0 1010 0Z" fill="url(#stone)" opacity=".95"/>
<path d="M874 0H1600V900H834V346C834 145 900 0 1100 0Z" fill="#273f4c" opacity=".27"/>
<path d="M904 900V352C904 184 1000 92 1186 92S1470 184 1470 352V900Z" fill="#283e49"/>
<path d="M951 900V362C951 219 1040 148 1186 148S1423 219 1423 362V900Z" fill="url(#sky)"/>
<circle cx="1240" cy="330" r="95" fill="#e7c58d" opacity=".76"/>
<path d="M952 555L1038 490L1094 534L1160 442L1230 520L1310 466L1422 555V900H952Z" fill="#314b52" opacity=".82"/>
<path d="M952 650L1033 600L1112 631L1180 574L1275 633L1356 581L1422 626V900H952Z" fill="#203a45"/>
