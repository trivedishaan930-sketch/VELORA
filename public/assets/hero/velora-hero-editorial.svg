<g fill="#dac7a8" opacity=".58">
 <path d="M1000 562V435Q1055 350 1110 435V562Z"/><path d="M1130 552V420Q1190 322 1250 420V552Z"/><path d="M1290 567V444Q1340 370 1390 444V567Z"/>
</g>
<g stroke="#f1e3ca" stroke-opacity=".35" fill="none" stroke-width="5">
