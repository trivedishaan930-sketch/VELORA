 <path d="M775 900Q730 770 760 650Q820 776 775 900Z"/><path d="M783 900Q850 770 910 745Q885 855 783 900Z"/>
</g>
<!-- two adult silhouettes in fully covered tailored clothing -->
<g>
 <!-- person on left -->
